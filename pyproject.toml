[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luma"
version = "0.2.0"
description = "Lightweight visual intelligence and servo control framework for robots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Luma contributors"}]
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.7",
]
yolo = [
    "ultralytics>=8.0",
]
apriltag = [
    "pupil-apriltags>=1.0",
]
dev = [
    "opencv-python-headless>=4.7",
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
luma = "luma.cli:main"
luma-sim = "luma.cli:main_simulation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
