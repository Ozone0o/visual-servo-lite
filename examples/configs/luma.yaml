# Luma configuration: Camera → Detector → Controller → Robot Adapter

detector:
  name: color
  lower_h: 0
  lower_s: 100
  lower_v: 100
  upper_h: 20
  upper_s: 255
  upper_v: 255
  min_area: 100

controller:
  name: smooth
  kp: 8.0
  alpha: 0.25
  max_output: 5.0

adapter:
  name: mock

pipeline:
  lost_timeout: 1.0
  lost_behavior: stop
  safety_limits:
    max_yaw: 30.0
    max_pitch: 20.0
    max_command_rate_hz: 30.0
    max_frame_age: 0.5
