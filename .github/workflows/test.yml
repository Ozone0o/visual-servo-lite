name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
      - name: Run tests
        run: |
          pytest
      - name: Lint Luma packages
        run: ruff check src tests examples ros2
      - name: Run offline simulation
        run: luma --simulation --steps 5
      - name: Build and smoke-test wheel
        run: |
          python -m build
          python -m venv /tmp/luma-wheel-smoke
          /tmp/luma-wheel-smoke/bin/pip install --no-deps dist/luma-*.whl
          /tmp/luma-wheel-smoke/bin/luma --help
